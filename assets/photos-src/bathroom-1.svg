  <path d="M500 228H690" stroke="#AEB8BF" stroke-width="7" stroke-linecap="round"/>
  <rect x="516" y="224" width="70" height="80" rx="4" fill="#3E8E96"/><rect x="516" y="286" width="70" height="8" fill="#2F7178"/>
  <rect x="604" y="224" width="70" height="66" rx="4" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="2"/><rect x="604" y="274" width="70" height="6" fill="#DCEAEC"/>
  <!-- bath mat -->
  <path d="M120 640H420L446 706H94Z" fill="#3E8E96"/>
  <path d="M136 652H404L420 694H118Z" fill="none" stroke="#BFE0E2" stroke-width="4"/>
  <!-- waste bin -->
  <path d="M690 536H740L734 600H696Z" fill="#E8EDF0" stroke="#AEB8BF" stroke-width="3"/>
