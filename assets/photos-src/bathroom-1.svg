  <rect x="250" y="398" width="22" height="42" rx="5" fill="#F2A65A"/><rect x="256" y="386" width="10" height="14" fill="#FFFFFF"/>
  <rect x="280" y="408" width="20" height="32" rx="5" fill="#5BA6A0"/><rect x="285" y="398" width="10" height="12" fill="#FFFFFF"/>
