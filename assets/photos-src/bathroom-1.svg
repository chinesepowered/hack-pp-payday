  <rect x="780" y="392" width="24" height="38" rx="6" fill="#F4C7D0"/><path d="M792 392V380H804" fill="none" stroke="#7E8A93" stroke-width="5"/>
  <rect x="936" y="400" width="26" height="30" rx="4" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="2"/>
  <path d="M944 400L940 372M954 400L960 370" stroke="#5BA6A0" stroke-width="5" stroke-linecap="round"/>
