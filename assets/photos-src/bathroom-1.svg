  <rect x="520" y="330" width="130" height="150" rx="10" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="3"/>
  <rect x="514" y="322" width="142" height="16" rx="6" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="3"/>
  <rect x="572" y="314" width="26" height="8" rx="4" fill="#AEB8BF"/>
