<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <pattern id="tile" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#BFE0E2"/>
      <rect x="2" y="2" width="60" height="60" fill="#D6EEEF"/>
    </pattern>
    <pattern id="floor" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect width="96" height="48" fill="#8FA3A8"/>
      <rect x="2" y="2" width="92" height="44" fill="#A9BBC0"/>
    </pattern>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FA"/><stop offset="1" stop-color="#B9D6E0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="768" fill="#F4F8F8"/>
  <rect y="200" width="1024" height="390" fill="url(#tile)"/>
  <rect y="196" width="1024" height="8" fill="#7FB7BA"/>
  <rect y="590" width="1024" height="178" fill="url(#floor)"/>
  <!-- small frosted window -->
  <rect x="150" y="40" width="170" height="130" rx="4" fill="#FFFFFF" stroke="#C8D4D6" stroke-width="3"/>
  <rect x="162" y="52" width="146" height="106" fill="#DCEFF7"/>
  <path d="M235 52V158" stroke="#FFFFFF" stroke-width="6"/>
