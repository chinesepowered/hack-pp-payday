  <path d="M100 440V408H132V420" fill="none" stroke="#AEB8BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="76" cy="428" r="8" fill="#AEB8BF"/><circle cx="154" cy="428" r="8" fill="#AEB8BF"/>
