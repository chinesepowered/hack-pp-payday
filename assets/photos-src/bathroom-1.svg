  <path d="M60 110V230M60 110H110" fill="none" stroke="#AEB8BF" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 110H130L138 126H88Z" fill="#AEB8BF"/>
  <path d="M370 96 H462 V540 Q450 548 440 540 Q428 548 416 540 Q404 548 392 540 Q380 548 370 540Z" fill="#F7FBFB" stroke="#CFE0E2" stroke-width="2"/>
  <path d="M392 100V538M416 100V538M440 100V538" stroke="#DCEAEC" stroke-width="3"/>
  <g fill="#7FB7BA"><circle cx="380" cy="96" r="5"/><circle cx="404" cy="96" r="5"/><circle cx="428" cy="96" r="5"/><circle cx="452" cy="96" r="5"/></g>
  <!-- bathtub -->
  <rect x="24" y="440" width="440" height="26" rx="13" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="3"/>
  <path d="M40 466H448V560 Q448 600 408 600H80 Q40 600 40 560Z" fill="#FFFFFF" stroke="#CAD6D9" stroke-width="3"/>
  <path d="M60 480V570 Q60 584 80 584" fill="none" stroke="#E6EEF0" stroke-width="6" stroke-linecap="round"/>
