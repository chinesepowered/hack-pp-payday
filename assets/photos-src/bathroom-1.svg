  <circle cx="856" cy="534" r="5" fill="#E8EDF0"/><circle cx="880" cy="534" r="5" fill="#E8EDF0"/>
  <path d="M868 430V400 Q868 384 886 384H900V394" fill="none" stroke="#AEB8BF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
